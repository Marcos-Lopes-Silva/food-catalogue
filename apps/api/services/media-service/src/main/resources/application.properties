spring.application.name=media-service
server.port=${SERVER_PORT:8088}
server.forward-headers-strategy=framework
server.error.include-message=always
server.error.include-stacktrace=never

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8071/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=

storage.s3.endpoint=${R2_ENDPOINT:}
storage.s3.region=${STORAGE_REGION:auto}
storage.s3.bucket=${R2_BUCKET:}
storage.s3.access-key=${R2_ACCESS_KEY:}
storage.s3.secret-key=${R2_SECRET_KEY:}
storage.s3.path-style-access=true
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
media.allowed-content-types=image/jpeg,image/png,image/webp
media.webp.quality=80
media.image.max-width=1600
media.image.thumbnail-width=400

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.application.name=auth-service
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=always
server.error.include-stacktrace=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}

application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.keystore-location=${JWT_KEYSTORE_LOCATION:}
application.security.jwt.keystore-password=${JWT_KEYSTORE_PASSWORD:}
application.security.jwt.key-alias=${JWT_KEY_ALIAS:jwt-signing}

application.bootstrap.admin.email=${AUTH_ADMIN_EMAIL:}
application.bootstrap.admin.password=${AUTH_ADMIN_PASSWORD:}

springdoc.server-url=http://localhost:8070/auth-service

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
